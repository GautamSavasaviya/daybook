  <!-- cover -->
  <rect x="16" y="8" width="88" height="104" rx="10" fill="url(#cover)"/>
  <rect x="16" y="8" width="16" height="104" rx="8" fill="#1c71d8"/>
  <rect x="24" y="8" width="8" height="104" fill="#1c71d8"/>
